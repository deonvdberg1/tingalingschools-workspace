<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — NG Kerk Meerensee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal.css?v=5">
  <style>
    /* page-specific styles only — shell handles layout */
    .toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .card .stat-inline { font-size: 14px; color: var(--rw-slate-500); }
  </style>
</head>
<body>
  <script>window.RW_PAGE = 'dashboard';</script>

  <!-- Content is wrapped by portal-shell.js into the portal layout -->
  <div class="page-head">
    <h1>Dashboard</h1>
    <p>Manage NG Kerk Meerensee platform.</p>
  </div>

  <div class="toolbar">
    <div class="toolbar-actions">
      <a href="/" class="btn btn-outline"><svg class="rw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0;vertical-align:middle;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> Back to Home</a>
      <a href="https://wa.me/27637321679" target="_blank" class="btn btn-primary"><svg class="rw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0;vertical-align:middle;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> WhatsApp Inbox</a>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="icon"><svg class="rw-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;flex-shrink:0;vertical-align:middle;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></div>
      <div><div class="value" id="totalUsers">0</div><div class="label">Total Users</div></div>
    </div>
    <div class="stat-card">
      <div class="icon gold"><svg class="rw-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;flex-shrink:0;vertical-align:middle;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><div class="value" id="totalClients">0</div><div class="label">Clients</div></div>
    </div>
    <div class="stat-card">
      <div class="icon light"><svg class="rw-icon" viewBox="0 0 24 24" fill="none" stroke="#8a6b45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;flex-shrink:0;vertical-align:middle;"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg></div>
      <div><div class="value" id="totalAdmins">0</div><div class="label">Admins</div></div>
    </div>
    <div class="stat-card">
      <div class="icon light"><svg class="rw-icon" viewBox="0 0 24 24" fill="none" stroke="#8a6b45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;flex-shrink:0;vertical-align:middle;"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></div>
      <div><div class="value" id="totalBookings">0</div><div class="label">Bookings</div></div>
    </div>
  </div>

  <div class="card table-card">
    <div class="card-title">Registered Users</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Joined</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="4" style="text-align:center;color:#888;padding:32px;">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card table-card">
    <div class="card-title">Upcoming Bookings</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Time Slot</th>
            <th>Guests</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="bookingsBody">
          <tr><td colspan="6" style="text-align:center;color:#888;padding:32px;">Loading bookings...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/portal-shell.js?v=5"></script>
  <script>
    window.RW_ON_LOAD = async function (user) {
      // ── Users ──
      try {
        const res = await fetch('/api/admin/users');
        const { users } = await res.json();
        document.getElementById('totalUsers').textContent = users.length;
        document.getElementById('totalClients').textContent = users.filter(u => u.role === 'client').length;
        document.getElementById('totalAdmins').textContent = users.filter(u => u.role === 'admin').length;
        document.getElementById('usersBody').innerHTML = users.map(u => `
          <tr>
            <td><strong>${u.name}</strong></td>
            <td>${u.email}</td>
            <td><span class="role-chip ${u.role}">${u.role}</span></td>
            <td style="color:#888;font-size:13px;">${new Date(u.createdAt).toLocaleDateString()}</td>
          </tr>`).join('');
      } catch (e) {
        document.getElementById('usersBody').innerHTML = '<tr><td colspan="4" style="text-align:center;color:#888;padding:32px;">Failed to load users</td></tr>';
      }

      // ── Bookings ──
      try {
        const res2 = await fetch('/api/admin/bookings');
        const { bookings } = await res2.json();
        document.getElementById('totalBookings').textContent = bookings.length;
        const future = bookings.filter(b => b.date >= new Date().toISOString().slice(0,10)).slice(0, 10);
        const slotName = (id) => {
          const map = { morning: 'Good Morning Kowie', afternoon: 'Afternoon Exploration', sunset: 'Sunset Passage', custom: 'Celebration Cruise' };
          return map[id] || id;
        };
        document.getElementById('bookingsBody').innerHTML = future.length ? future.map(b => `
          <tr>
            <td>${b.date}</td>
            <td>${slotName(b.timeSlot)}</td>
            <td>${b.guests}</td>
            <td>${b.name || b.userName || '—'}</td>
            <td>${b.phone || '—'}</td>
            <td><span class="role-chip ${b.status === 'confirmed' ? 'admin' : 'client'}">${b.status}</span></td>
          </tr>`).join('')
          : '<tr><td colspan="6" style="text-align:center;color:#888;padding:32px;">No upcoming bookings yet</td></tr>';
      } catch (e) {
        document.getElementById('bookingsBody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;padding:32px;">No bookings yet</td></tr>';
      }
    };
  </script>
</body>
</html>
