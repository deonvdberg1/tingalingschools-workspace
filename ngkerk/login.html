<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NG Kerk Meerensee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Raleway', sans-serif;
      min-height: 100vh;
      display: flex;
      background: #fcfaf7;
    }
    .auth-side {
      flex: 1;
      background: linear-gradient(135deg, #1a2e3a, #2a5a6a);
      display: flex; align-items: center; justify-content: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    .auth-side::before {
      content: '';
      position: absolute; inset: 0;
      background: url('images/hero.jpg') center/cover no-repeat;
      opacity: 0.15;
    }
    .auth-side-content { position: relative; z-index: 1; text-align: center; color: #fcfaf7; max-width: 360px; }
    .auth-side-content h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 12px; color: #fcfaf7; }
    .auth-side-content p { opacity: 0.8; line-height: 1.6; font-weight: 300; }
    .auth-form-wrap {
      width: 460px; padding: 60px 48px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .auth-form-wrap h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #1a2e3a; margin-bottom: 8px; }
    .auth-form-wrap .sub { color: #888; margin-bottom: 32px; font-size: 0.95rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #4a4a4a; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
    .form-group input {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 0.95rem; font-family: 'Raleway', sans-serif;
      transition: border-color 0.2s;
      background: #fff;
    }
    .form-group input:focus { outline: none; border-color: #b8956a; }
    .btn-submit {
      width: 100%; padding: 14px;
      background: #1a2e3a; color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
      font-family: 'Raleway', sans-serif;
    }
    .btn-submit:hover { background: #b8956a; }
    .auth-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #888; }
    .auth-link a { color: #b8956a; font-weight: 600; text-decoration: none; }
    .auth-link a:hover { text-decoration: underline; }
    .error-msg { background: #fef2f2; color: #b91c1c; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; display: none; }
    .error-msg.show { display: block; }
    .back-link { margin-bottom: 24px; display: inline-block; color: #b8956a; font-size: 0.85rem; text-decoration: none; font-weight: 500; }
    .back-link:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .auth-side { display: none; }
      .auth-form-wrap { width: 100%; padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <div class="auth-side">
    <div class="auth-side-content">
      <h2>NG Kerk Meerensee</h2>
      <p>Private river cruises on the beautiful Kowie River in Port Alfred.</p>
    </div>
  </div>
  <div class="auth-form-wrap">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h1>Welcome Back</h1>
    <p class="sub">Sign in to your account to manage bookings.</p>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
    <p class="auth-link">NG Kerk Meerensee — admin-toegang</p>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('errorMsg');
      err.classList.remove('show');
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.error;
        err.classList.add('show');
        return;
      }
      window.location.href = data.user.role === 'admin' ? '/admin' : '/dashboard';
    });
  </script>
</body>
</html>
