    <script>
      (function () {
        function isInternal() {
          try {
            // Explicit opt-out flag (set from portal Analytics page)
            if (localStorage.getItem('ae_internal') === '1') return true;
            // Portal users (admin/staff) browsing the site count as internal
            var t = localStorage.getItem('tingaling_token');
            if (t) {
              var u = JSON.parse(atob(t));
              if (u.role === 'client_admin' || u.role === 'overlord' || u.role === 'staff') return true;
            }
          } catch (e) {}
          return false;
        }
        function send(data) {
          try {
            var body = JSON.stringify(Object.assign({
              clientId: 6,
              path: location.pathname,
              title: document.title,
              referrer: document.referrer,
              screen: (window.screen ? window.screen.width + 'x' + window.screen.height : ''),
              ua: navigator.userAgent,
              internal: isInternal() ? 1 : 0
            }, data || {}));
            var url = 'https://whatsapp.autoeffortless.com/api/site-track';
            if (navigator.sendBeacon) {
              navigator.sendBeacon(url, new Blob([body], { type: 'text/plain' }));
            } else {
              fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: body, keepalive: true });
            }
          } catch (e) {}
        }
        window.AETrack = function (label, title) {
          send({ event: true, label: label, title: title || document.title });
        };
        if (document.readyState === 'complete') send({});
        else window.addEventListener('load', function () { send({}); });
        // Track SPA route changes too
        var origPush = history.pushState;
        history.pushState = function () {
          var r = origPush.apply(this, arguments);
          send({});
          return r;
        };
        window.addEventListener('popstate', function () { send({}); });
      })();
    </script>
