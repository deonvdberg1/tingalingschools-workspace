<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmation — Snowman</title>
<link rel="icon" href="assets/img/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Outfit',sans-serif;background:var(--ice,#f3f7fb);color:#0a1424;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:#fff;border:1px solid #d8e3ef;border-radius:24px;max-width:520px;width:100%;padding:44px;text-align:center;box-shadow:0 24px 60px rgba(10,31,68,.12)}
  .ic{width:72px;height:72px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .ic svg{width:34px;height:34px}
  h1{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:30px;margin-bottom:10px;color:#0a1f44}
  p{color:#5d6f8a;font-size:15px;margin-bottom:8px}
  .ref{font-size:13px;color:#da5800;font-weight:600;margin-bottom:22px}
  .btn{display:inline-block;background:#da5800;color:#fff;border-radius:999px;padding:14px 30px;font-weight:600;text-decoration:none;margin-top:18px}
  .btn.ghost{background:#0a1f44;margin-left:8px}
  .pending .ic{background:#da5800}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="ic" id="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
  <h1 id="title">Checking your payment…</h1>
  <p id="msg">Please wait a moment.</p>
  <div class="ref" id="ref"></div>
  <a class="btn" href="shop.html">Continue shopping</a>
  <a class="btn ghost" href="https://wa.me/27832368368" target="_blank" rel="noopener">WhatsApp us</a>
</div>
<script>
const params = new URLSearchParams(location.search);
const ref = params.get("reference") || params.get("trxref") || "";
const pending = JSON.parse(localStorage.getItem("snowman_pending_order") || "null");
document.getElementById("ref").textContent = ref ? "Reference: " + ref : "";
async function check(){
  if (!ref) {
    document.getElementById("title").textContent = "Order received";
    document.getElementById("msg").textContent = "We'll confirm your order shortly.";
    return;
  }
  try {
    const r = await fetch("https://app.autoeffortless.com/api/snowman/order?reference=" + encodeURIComponent(ref));
    const d = await r.json();
    if (d.status === "success") {
      document.getElementById("title").textContent = "Thank you! Order confirmed";
      const items = (d.order.items || []).map(i => i.name + " x" + i.qty).join(", ");
      document.getElementById("msg").textContent = items ? "We've received your order: " + items + ". We'll be in touch to arrange delivery or pickup." : "We've received your order. We'll be in touch shortly.";
      localStorage.removeItem("snowman_pending_order");
      localStorage.removeItem("snowman_cart");
    } else {
      document.getElementById("title").textContent = "Payment processing…";
      document.getElementById("msg").textContent = "Your payment is being confirmed. This page will refresh.";
      setTimeout(() => location.reload(), 5000);
    }
  } catch (e) {
    document.getElementById("title").textContent = "Order received";
    document.getElementById("msg").textContent = "We'll confirm your payment and order shortly.";
  }
}
check();
</script>
</body>
</html>
